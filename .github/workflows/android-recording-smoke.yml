name: Android continuous recording

on:
  push:
    paths:
      - '.github/workflows/android-recording-smoke.yml'
      - 'jni/src/record_*.cpp'
      - 'jni/src/screen_capture.cpp'
      - 'jni/src/main.cpp'
      - 'jni/Android.mk'
      - 'jni/include/record_*.h'
      - 'jni/include/startup_key*.h'
      - 'tools/tests/android_startup*'
      - 'tools/tests/startup_cli.cpp'
      - 'tools/tests/android_record_*.py'
      - 'tools/tests/android_record_*.cpp'
      - 'tools/tests/record_mp4_*.py'
      - 'tools/tests/record_mp4_*.cpp'
  pull_request:
    paths:
      - '.github/workflows/android-recording-smoke.yml'
      - 'jni/src/record_*.cpp'
      - 'jni/src/screen_capture.cpp'
      - 'jni/src/main.cpp'
      - 'jni/Android.mk'
      - 'jni/include/record_*.h'
      - 'jni/include/startup_key*.h'
      - 'tools/tests/android_startup*'
      - 'tools/tests/startup_cli.cpp'
      - 'tools/tests/android_record_*.py'
      - 'tools/tests/android_record_*.cpp'
      - 'tools/tests/record_mp4_*.py'
      - 'tools/tests/record_mp4_*.cpp'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recording-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recording:
    name: Android ${{ matrix.api }} recording
    runs-on: ubuntu-latest
    env:
      ANDROID_RECORD_SECONDS: ${{ matrix.seconds || 7 }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - {api: 26, target: default, seconds: 190}
          - {api: 28, target: default}
          - {api: 29, target: default}
          - {api: 30, target: default}
          - {api: 31, target: default}
          - {api: 33, target: default}
          - {api: 34, target: default}
          - {api: 35, target: google_apis}
          - {api: 36, target: google_apis}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'cmdline-tools;latest'
      - name: Prepare NDK and host video tools
        run: |
          LOG="$RUNNER_TEMP/prepare-recording.log"
          exec 3>&1
          exec >"$LOG" 2>&1
          report_prepare() {
            rc="$1"
            if [ "$rc" -ne 0 ]; then
              python3 -c 'import pathlib,sys; s=pathlib.Path(sys.argv[1]).read_text(errors="replace")[-6000:]; print("::error title=Recorder preparation::"+s.replace("%","%25").replace("\r","%0D").replace("\n","%0A"))' "$LOG" >&3 || true
            fi
            cat "$LOG" >&3
            exit "$rc"
          }
          trap 'report_prepare $?' EXIT
          df -h "$ANDROID_SDK_ROOT"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager 'ndk;26.3.11579264' >/dev/null
          python3 -m pip install --user 'av==16.0.1'
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -Ijni/include \
            jni/src/record_mp4.cpp tools/tests/record_mp4_driver.cpp -o "$RUNNER_TEMP/mp4-driver"
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -DRECORD_MP4_TEST_INDEX_ENTRIES=3 -Ijni/include \
            jni/src/record_mp4.cpp tools/tests/record_mp4_driver.cpp -o "$RUNNER_TEMP/mp4-small-index"
          if ! python3 tools/tests/record_mp4_real_test.py "$RUNNER_TEMP/mp4-driver" "$RUNNER_TEMP/mp4-small-index" >"$RUNNER_TEMP/mp4.log" 2>&1; then
            python3 -c 'import pathlib,sys; print("::error title=MP4 writer smoke::"+pathlib.Path(sys.argv[1]).read_text().replace("%","%25").replace("\n","%0A"))' "$RUNNER_TEMP/mp4.log"
            cat "$RUNNER_TEMP/mp4.log"
            exit 1
          fi
          COMPILER="$ANDROID_SDK_ROOT/ndk/26.3.11579264/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android26-clang++"
          if ! "$COMPILER" -std=c++17 -O2 -Wall -Wextra -Werror -fPIE -pie -static-libstdc++ -Ijni/include \
            jni/src/record_capture.cpp jni/src/record_display.cpp jni/src/record_mp4.cpp \
            tools/tests/android_record_helper.cpp -lmediandk -landroid -ldl -llog -o "$RUNNER_TEMP/record-helper" >"$RUNNER_TEMP/record-build.log" 2>&1; then
            python3 -c 'import pathlib,sys; print("::error title=Recorder build::"+pathlib.Path(sys.argv[1]).read_text().replace("%","%25").replace("\n","%0A"))' "$RUNNER_TEMP/record-build.log"
            cat "$RUNNER_TEMP/record-build.log"
            exit 1
          fi
          "$COMPILER" -std=c++17 -O2 -Wall -Wextra -Werror -fPIE -pie -static-libstdc++ \
            tools/tests/android_record_inspect.cpp -lmediandk -o "$RUNNER_TEMP/record-inspect"
          "$COMPILER" -std=c++17 -O3 -ffast-math -flto -fomit-frame-pointer -fno-jump-tables \
            -fvisibility=hidden -fvisibility-inlines-hidden -ffunction-sections -fdata-sections \
            -fPIE -pie -static-libstdc++ -Ijni/include \
            -Wl,--gc-sections,--icf=all,--exclude-libs,ALL,-s,--rosegment \
            -Wl,-z,separate-code -Wl,-z,max-page-size=16384 \
            jni/src/bw_obf.cpp jni/src/screen_capture.cpp jni/src/record_capture.cpp \
            jni/src/record_display.cpp jni/src/record_mp4.cpp tools/tests/android_record_supervisor.cpp \
            -lmediandk -landroid -ldl -llog -o "$RUNNER_TEMP/record-supervisor"
          cp "$RUNNER_TEMP/record-supervisor" "$RUNNER_TEMP/record-supervisor-plain"
          python3 tools/obf/elf_crypt.py "$RUNNER_TEMP/record-supervisor" --key 0x6A09E667F3BCC909
          python3 tools/obf/elf_crypt.py "$RUNNER_TEMP/record-supervisor" --check
          # The gate's real nonblocking reader and ImGui keyboard are also
          # exercised on Bionic/GLES. This does not install MT Manager.
          "$COMPILER" -std=c++17 -O3 -ffast-math -flto -fno-jump-tables \
            -ffunction-sections -fdata-sections -fPIE -pie -static-libstdc++ -Ijni/include \
            jni/src/bw_obf.cpp tools/tests/startup_cli.cpp \
            -Wl,--gc-sections,--icf=all,--exclude-libs,ALL,-s,--rosegment \
            -Wl,-z,separate-code -Wl,-z,max-page-size=16384 -o "$RUNNER_TEMP/startup-plain"
          cp "$RUNNER_TEMP/startup-plain" "$RUNNER_TEMP/startup-encrypted"
          python3 tools/obf/elf_crypt.py "$RUNNER_TEMP/startup-encrypted" --key 0x6A09E667F3BCC909
          python3 tools/obf/elf_crypt.py "$RUNNER_TEMP/startup-encrypted" --check
          "$COMPILER" -std=c++17 -O2 -DIMGUI_ENABLE_TEST_ENGINE -DIMGUI_IMPL_OPENGL_ES3 \
            -fPIE -pie -static-libstdc++ -Ijni/include -Ijni/include/ImGui \
            tools/tests/android_startup_ui.cpp jni/src/ImGui/imgui.cpp \
            jni/src/ImGui/imgui_draw.cpp jni/src/ImGui/imgui_widgets.cpp jni/src/ImGui/imgui_tables.cpp \
            jni/src/ImGui/backends/imgui_impl_opengl3.cpp -lEGL -lGLESv3 -landroid -ldl \
            -o "$RUNNER_TEMP/startup-ui"
          echo "ANDROID_STARTUP_PLAIN=$RUNNER_TEMP/startup-plain" >> "$GITHUB_ENV"
          echo "ANDROID_STARTUP_ENCRYPTED=$RUNNER_TEMP/startup-encrypted" >> "$GITHUB_ENV"
          echo "ANDROID_STARTUP_UI=$RUNNER_TEMP/startup-ui" >> "$GITHUB_ENV"
          echo "ANDROID_RECORD_HELPER=$RUNNER_TEMP/record-helper" >> "$GITHUB_ENV"
          echo "ANDROID_RECORD_INSPECT=$RUNNER_TEMP/record-inspect" >> "$GITHUB_ENV"
          echo "ANDROID_RECORD_SUPERVISOR=$RUNNER_TEMP/record-supervisor" >> "$GITHUB_ENV"
          echo "ANDROID_RECORD_SUPERVISOR_PLAIN=$RUNNER_TEMP/record-supervisor-plain" >> "$GITHUB_ENV"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test recording on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            python3 tools/tests/android_startup_smoke.py
            python3 tools/tests/android_record_symbols.py
            python3 tools/tests/android_record_smoke.py
