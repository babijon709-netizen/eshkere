name: Android system keyboard
on:
  push:
    paths:
      - '.github/workflows/android-ime-smoke.yml'
      - 'tools/startup_ime/**'
      - 'tools/tests/android_ime*'
      - 'jni/include/startup_*.h'
      - 'jni/src/startup_ime.cpp'
      - 'jni/src/main.cpp'
      - 'jni/src/stealth.h'
      - 'build.sh'
  pull_request:
    paths:
      - '.github/workflows/android-ime-smoke.yml'
      - 'tools/startup_ime/**'
      - 'tools/tests/android_ime*'
      - 'jni/include/startup_*.h'
      - 'jni/src/startup_ime.cpp'
      - 'jni/src/main.cpp'
      - 'jni/src/stealth.h'
      - 'build.sh'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ime-smoke-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ime:
    name: Android ${{ matrix.api }} system IME
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {api: 26, target: default}
          - {api: 30, target: default}
          - {api: 33, target: default}
          - {api: 35, target: google_apis}
          - {api: 36, target: google_apis}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'cmdline-tools;latest'
      - name: Build real Activity and native bridge
        shell: bash
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/ime-build.log"
          exec 3>&1
          exec >"$LOG" 2>&1
          report() {
            rc="$1"
            if [ "$rc" -ne 0 ]; then
              python3 -c 'import pathlib,sys; s=pathlib.Path(sys.argv[1]).read_text(errors="replace")[-2200:]; print("::error title=IME build::"+s.replace("%","%25").replace("\r","%0D").replace("\n","%0A"))' "$LOG" >&3 || true
            fi
            cat "$LOG" >&3
            exit "$rc"
          }
          trap 'report $?' EXIT
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager 'ndk;26.3.11579264' 'platforms;android-35' 'build-tools;35.0.0' >/dev/null
          mkdir -p "$RUNNER_TEMP/ime"
          tools/startup_ime/build.sh "$RUNNER_TEMP/ime/startup_ime_apk.inc"
          COMPILER="$ANDROID_SDK_ROOT/ndk/26.3.11579264/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android26-clang++"
          "$COMPILER" -std=c++17 -O3 -ffast-math -flto -fno-jump-tables \
            -ffunction-sections -fdata-sections -fPIE -pie -static-libstdc++ \
            -I"$RUNNER_TEMP/ime" -Ijni/include -Ijni/src \
            jni/src/bw_obf.cpp jni/src/startup_ime.cpp tools/tests/android_ime_bridge.cpp \
            -Wl,--gc-sections,--icf=all,--exclude-libs,ALL,-s,--rosegment \
            -Wl,-z,separate-code -Wl,-z,max-page-size=16384 -o "$RUNNER_TEMP/ime-plain"
          cp "$RUNNER_TEMP/ime-plain" "$RUNNER_TEMP/ime-encrypted"
          python3 tools/obf/elf_crypt.py "$RUNNER_TEMP/ime-encrypted" --key 0x6A09E667F3BCC909
          python3 tools/obf/elf_crypt.py "$RUNNER_TEMP/ime-encrypted" --check
          echo "ANDROID_IME_PLAIN=$RUNNER_TEMP/ime-plain" >> "$GITHUB_ENV"
          echo "ANDROID_IME_ENCRYPTED=$RUNNER_TEMP/ime-encrypted" >> "$GITHUB_ENV"
          echo "ANDROID_IME_HEADER=$RUNNER_TEMP/ime/startup_ime_apk.inc" >> "$GITHUB_ENV"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test actual Android keyboard
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: python3 tools/tests/android_ime_smoke.py
