name: Android continuous recording

on:
  push:
    paths:
      - '.github/workflows/android-recording-smoke.yml'
      - 'jni/src/record_*.cpp'
      - 'jni/include/record_*.h'
      - 'tools/tests/android_record_*.py'
      - 'tools/tests/android_record_*.cpp'
  pull_request:
    paths:
      - '.github/workflows/android-recording-smoke.yml'
      - 'jni/src/record_*.cpp'
      - 'jni/include/record_*.h'
      - 'tools/tests/android_record_*.py'
      - 'tools/tests/android_record_*.cpp'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recording-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recording:
    name: Android ${{ matrix.api }} recording
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - {api: 26, target: default}
          - {api: 28, target: default}
          - {api: 29, target: default}
          - {api: 30, target: default}
          - {api: 34, target: default}
          - {api: 35, target: google_apis}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'cmdline-tools;latest'
      - name: Prepare NDK and host video tools
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager 'ndk;26.3.11579264'
          python3 -m pip install --user 'av==16.0.1'
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -Ijni/include \
            jni/src/record_mp4.cpp tools/tests/record_mp4_driver.cpp -o "$RUNNER_TEMP/mp4-driver"
          python3 tools/tests/record_mp4_real_test.py "$RUNNER_TEMP/mp4-driver"
          COMPILER="$ANDROID_SDK_ROOT/ndk/26.3.11579264/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android26-clang++"
          "$COMPILER" -std=c++17 -O2 -Wall -Wextra -Werror -fPIE -pie -static-libstdc++ -Ijni/include \
            jni/src/record_capture.cpp jni/src/record_display.cpp jni/src/record_mp4.cpp \
            tools/tests/android_record_helper.cpp -lmediandk -landroid -ldl -llog -o "$RUNNER_TEMP/record-helper"
          echo "ANDROID_RECORD_HELPER=$RUNNER_TEMP/record-helper" >> "$GITHUB_ENV"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test recording on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            python3 tools/tests/android_record_symbols.py
            python3 tools/tests/android_record_smoke.py
