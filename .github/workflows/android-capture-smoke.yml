name: Android capture merge smoke

on:
  push:
    paths:
      - '.github/workflows/android-capture-smoke.yml'
      - 'jni/src/capture_merge.cpp'
      - 'jni/include/capture_merge.h'
      - 'tools/tests/android_capture_merge_helper.cpp'
      - 'tools/tests/android_capture_smoke.py'
  pull_request:
    paths:
      - '.github/workflows/android-capture-smoke.yml'
      - 'jni/src/capture_merge.cpp'
      - 'jni/include/capture_merge.h'
      - 'tools/tests/android_capture_merge_helper.cpp'
      - 'tools/tests/android_capture_smoke.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capture-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  media-ndk:
    name: Android 8 MediaNDK and real MP4
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'cmdline-tools;latest'
      - name: Prepare NDK and host video tooling
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager 'ndk;26.3.11579264'
          python3 -m pip install --user 'av==16.0.1'
          COMPILER="$ANDROID_SDK_ROOT/ndk/26.3.11579264/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android24-clang++"
          "$COMPILER" -std=c++17 -O2 -fPIE -pie -static-libstdc++ -Ijni/include \
            jni/src/capture_merge.cpp tools/tests/android_capture_merge_helper.cpp \
            -lmediandk -o "$RUNNER_TEMP/capture-merge-helper"
          echo "ANDROID_CAPTURE_MERGE_HELPER=$RUNNER_TEMP/capture-merge-helper" >> "$GITHUB_ENV"
      - name: Enable KVM for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise real MP4 merge on Android 8
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 26
          target: default
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: python3 tools/tests/android_capture_smoke.py
