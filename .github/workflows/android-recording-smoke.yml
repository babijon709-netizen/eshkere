name: Android continuous recording

on:
  push:
    paths:
      - '.github/workflows/android-recording-smoke.yml'
      - 'jni/src/record_*.cpp'
      - 'jni/include/record_*.h'
      - 'tools/tests/android_record_*.py'
      - 'tools/tests/android_record_*.cpp'
  pull_request:
    paths:
      - '.github/workflows/android-recording-smoke.yml'
      - 'jni/src/record_*.cpp'
      - 'jni/include/record_*.h'
      - 'tools/tests/android_record_*.py'
      - 'tools/tests/android_record_*.cpp'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recording-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recording:
    name: Android ${{ matrix.api }} recording
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api: [26, 30, 34, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'cmdline-tools;latest'
      - name: Prepare NDK and host video tools
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager 'ndk;26.3.11579264'
          python3 -m pip install --user 'av==16.0.1'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test recording on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: default
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: python3 tools/tests/android_record_symbols.py
