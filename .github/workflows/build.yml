name: Build benzware.sh

on:
  push:
    branches:
      - '**'

  pull_request:
    branches:
      - '**'

  workflow_dispatch:

# Бинарник только собирается и загружается как artifact.
# Автоматический git push отключён, чтобы избежать non-fast-forward.
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: 26.3.11579264

jobs:
  build:
    name: Android arm64-v8a
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'cmdline-tools;latest'

      - name: Install Android NDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "ndk;${NDK_VERSION}"

          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "${GITHUB_ENV}"
          echo "ANDROID_NDK_ROOT=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "${GITHUB_ENV}"

      - name: Host checks (unit tests, menu rig, obfuscation pipeline)
        shell: bash
        run: |
          LOG="$RUNNER_TEMP/host-tests.log"
          exec 3>&1
          exec >"$LOG" 2>&1
          report_host() {
            rc="$1"
            if [ "$rc" -ne 0 ]; then
              python3 -c 'import pathlib,sys; s=pathlib.Path(sys.argv[1]).read_text(errors="replace")[-6000:]; print("::error title=Host tests::"+s.replace("%","%25").replace("\r","%0D").replace("\n","%0A"))' "$LOG" >&3 || true
            fi
            cat "$LOG" >&3
            exit "$rc"
          }
          trap 'report_host $?' EXIT
          chmod +x tools/tests/*.sh
          tools/tests/run_all_host_tests.sh
          tools/tests/run_menu_ui.sh
          tools/tests/run_farm_tests.sh
          tools/tests/run_capture_surface.sh
          tools/tests/run_screen_capture.sh
          tools/tests/run_startup_cli.sh
          tools/tests/run_obf_selftest.sh

      - name: Build
        shell: bash
        run: |
          chmod +x build.sh
          if ! ./build.sh 2>&1 | tee /tmp/build.log; then
            python3 -c 'import pathlib; s=pathlib.Path("/tmp/build.log").read_text(errors="replace")[-2200:]; print("::error title=Android build::"+s.replace("%","%25").replace("\r","%0D").replace("\n","%0A"))'
            exit 1
          fi
          # Отчёт обфускации выносим в annotations рана: видно без скачивания
          # логов. GitHub режет >10 notice на чек-ран, поэтому ключевые строки
          # пакуем в один notice, а не по строке на каждый.
          # Ключ шифрования НЕ должен попасть ни в логи, ни в annotations:
          # репозиторий публичный, elf_crypt.py тоже — по ключу строки снимаются
          # оффлайн. Redact + жёсткая проверка на случай, если ключ снова
          # начнёт печатать какой-нибудь другой шаг.
          if grep -qE 'ключ = 0x[0-9a-f]{16}' /tmp/build.log; then
            echo "::error::ключ обфускации утёк в лог сборки" >&2
            exit 1
          fi
          REPORT="$(grep -E 'зашифровано|секций \.rodata|PF_W добавлен|WARN 16K|рантайм-карта|таблица секций вырезана|контрольных строк: 0' /tmp/build.log | sed -E 's/ключ = 0x[0-9a-f]+/ключ = <hidden>/g' | tr '\n' '|')"
          echo "::notice::obf:$REPORT"
          echo "::notice::ELF: section headers=$(readelf -h libs/arm64-v8a/benzware.sh | grep -E 'Number of section headers' | tr -d ' ')"
          echo "::notice::LOAD: $(readelf -lW libs/arm64-v8a/benzware.sh | grep -E '^  (LOAD|GNU_RELRO)' | tr '\n' '|')"

          file libs/arm64-v8a/benzware.sh
          sha256sum libs/arm64-v8a/benzware.sh | tee libs/arm64-v8a/benzware.sh.sha256
          # Устройство уже прошивали устаревшим артефактом — пусть в annotations
          # будет однозначная метка именно этого бинаря.
          echo "::notice::ARTIFACT: sha256=$(cut -d' ' -f1 < libs/arm64-v8a/benzware.sh.sha256) | commit=$(git rev-parse --short HEAD) | size=$(stat -c%s libs/arm64-v8a/benzware.sh)"

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: benzware-sh-arm64-v8a
          path: |
            libs/arm64-v8a/benzware.sh
            libs/arm64-v8a/benzware.sh.sha256
          if-no-files-found: error
          
